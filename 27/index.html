<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            
        }
        body{
            width:100%;
            height:100%

        }
        .container{
            width:100%;
            height:100%;
             margin:2rem;
            padding:2rem;
            background-color:rgb(187, 75, 75);
        }
        .item{
            width:250px;
            height:250px;
            margin:2rem;
            padding:2rem;
            background-color: rgb(161, 210, 143);
           
            
        }
        #a:hover{
             transform:rotateY(45deg);
                          transform:rotateX(45deg);

                                       transform:rotateZ(45deg);

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="a">A</div>
       
    </div>
</body>
